<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인스타그램 인증 완료</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background:#0B1420; color:#E7ECF3; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; }
  .box { max-width:520px; background:#121C2B; border:1px solid #223047; border-radius:12px; padding:28px; text-align:center; }
  h1 { font-size:20px; margin:0 0 12px; }
  p { color:#93A0B4; font-size:14px; line-height:1.6; }
  .url-box { background:#182335; border:1px solid #223047; border-radius:8px; padding:12px; word-break:break-all; font-size:12.5px; margin:16px 0; text-align:left; font-family: ui-monospace, Consolas, monospace; }
  button { background:#3D6FE0; color:white; border:none; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
  button:hover { background:#2f5bc4; }
  .copied { color:#57C08A; font-size:13px; margin-top:8px; height:16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>인증이 완료되었습니다</h1>
    <p>아래 주소창의 전체 URL을 복사해서 카드뉴스 챗봇에게 붙여넣어 주세요.</p>
    <div class="url-box" id="url"></div>
    <button onclick="copyUrl()">URL 복사</button>
    <div class="copied" id="copied"></div>
  </div>
  <script>
    document.getElementById('url').textContent = window.location.href;
    function copyUrl() {
      navigator.clipboard.writeText(window.location.href).then(function () {
        document.getElementById('copied').textContent = '복사됨!';
      });
    }
  </script>
</body>
</html>
